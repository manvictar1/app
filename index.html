return`${head('dash')}<div class="grid">${c('🏫',S.classes.length,'Classes')}${c('👨‍🎓',S.students.length,'Élèves')}${c('🚫',ab.size,'Absents aujourd’hui')}${c('⏰',la.size,'En retard aujourd’hui')}${c('📅',sess/2,'Jours d’absence (mois)')}${c('⏱️',min,'Minutes de retard (mois)')}</div>
<div class="card"><h3>Accès rapide aux classes</h3><div class="row">${S.classes.map(k=>`<button onclick="openClass(${k.id})">${esc(k.name)} <span class="mu">· ${S.students.filter(s=>s.cid===k.id).length}</span></button>`).join('')||'<span class="mu">Aucune classe. Commencez par « Classes et élèves ».</span>'}</div></div>
<div class="card"><h3>Statistiques du mois par classe</h3><div style="height:290px"><canvas id="ch"></canvas></div></div>`};
function drawChart(){const [f,l]=monthR(),cv=$('#ch');if(!cv)return;if(chart1)chart1.destroy();const sum=(c,k)=>S.students.filter(s=>s.cid===c.id).reduce((a,s)=>a+stats(s.id,f,l)[k],0);
chart1=new Chart(cv,{type:'bar',data:{labels:S.classes.map(c=>c.name),datasets:[{label:T('Jours d’absence'),data:S.classes.map(c=>sum(c,'days')),backgroundColor:'#dc3545',borderRadius:6},{label:T('Minutes de retard'),data:S.classes.map(c=>sum(c,'min')),backgroundColor:'#4f46e5',borderRadius:6}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}})}
function openClass(id){cur.cls=id;go('classes')}

V.classes=()=>`${head('classes')}<div class="card"><div class="row"><button class="pri" onclick="addClass()">+ Nouvelle classe</button></div><div class="row">${S.classes.map(c=>`<span class="chip"><button onclick="openClass(${c.id})" ${c.id===cur.cls?'class="pri"':''}>${esc(c.name)}</button><button title="Renommer" onclick="editClass(${c.id})">✎</button><button class="dg" title="Supprimer" onclick="delClass(${c.id})">🗑</button></span>`).join('')||'<span class="mu">Aucune classe.</span>'}</div></div>
${cur.cls?`<div class="card"><h3>Élèves · ${esc(cname(cur.cls))}</h3><div class="row"><button class="pri" onclick="addStu()">+ Ajouter un élève</button><input placeholder="🔍 Rechercher par nom" value="${esc(cur.q)}" oninput="cur.q=this.value;$('#stl').innerHTML=stl()"></div><div class="wrap" id="stl">${stl()}</div></div>`:''}`;
function stl(){const q=cur.q.trim().toLowerCase();const a=sorted(S.students.filter(s=>s.cid===cur.cls&&s.name.toLowerCase().includes(q)));return`<table><tr><th>N°</th><th style="text-align:start">Nom</th><th></th></tr>${a.map(s=>`<tr><td>${s.sid}</td><td class="l">${esc(s.name)}</td><td><button onclick="editStu(${s.id})">✎</button> <button class="dg" onclick="delStu(${s.id})">🗑</button></td></tr>`).join('')||'<tr><td colspan="3" class="empty">Aucun élève</td></tr>'}</table>`}
async function addClass(){const r=await dlg('Nouvelle classe',[['Nom de la classe','']]);if(r&&r[0]){const id=await put('classes',{id:nid(),name:r[0]});await load();cur.cls=id;render()}}
async function editClass(id){const c=S.classes.find(x=>x.id===id),r=await dlg('Renommer la classe',[['Nom',c.name]]);if(r&&r[0]){c.name=r[0];await put('classes',c);render()}}
async function delClass(id){if(!await dlg('Supprimer cette classe, ses élèves et tout leur historique ?',[],'Supprimer'))return;for(const s of S.students.filter(s=>s.cid===id))await delStuData(s.id);await del('classes',id);if(cur.cls===id)cur.cls=null;await load();render()}
const nextSid=()=>'ST'+String(S.students.reduce((m,s)=>Math.max(m,+s.sid.slice(2)||0),0)+1).padStart(4,'0');
async function addStu(){const r=await dlg('Nouvel élève',[['Nom complet','']]);if(r&&r[0]){await put('students',{id:nid(),sid:nextSid(),name:r[0],cid:cur.cls});await load();render()}}
async function editStu(id){const s=S.students.find(x=>x.id===id),r=await dlg('Modifier l’élève',[['Nom',s.name]]);if(r&&r[0]){s.name=r[0];await put('students',s);render()}}
async function delStuData(id){await del('students',id);for(const r of [...AM.values()])if(r.sid===id)await del('att',r.k)}
async function delStu(id){if(!await dlg('Supprimer cet élève et tout son historique ?',[],'Supprimer'))return;await delStuData(id);await load();render()}

V.att=()=>{if(!cur.cls&&S.classes.length)cur.cls=S.classes[0].id;const d=cur.date,long=new Date(d+'T12:00:00').toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
return`${head('att')}<div class="card"><div class="row"><select onchange="cur.cls=+this.value;render()">${opts(cur.cls)}</select><span class="chip"><button onclick="cur.date=addD(cur.date,-1);render()">◀</button><input type="date" value="${d}" style="border:0" onchange="cur.date=this.value||td();render()"><button onclick="cur.date=addD(cur.date,1);render()">▶</button></span><button onclick="cur.date=td();render()">Aujourd’hui</button><button class="pri" onclick="allPresent()">✓ Tous présents</button></div><div class="date">📅 ${long}</div>${isOff(d)?`<div class="date" style="background:var(--wab);color:var(--wa);margin-inline-start:8px">🏖️ Jour non travaillé : <b>${esc(T(offName(d)))}</b> — non compté dans les totaux</div>`:''}
<div class="wrap"><table><tr><th rowspan="2">#</th><th rowspan="2" style="text-align:start">Élève</th><th colspan="2">Matin</th><th colspan="2">Après-midi</th><th rowspan="2">Motif d’absence</th></tr><tr><th>Statut</th><th>Retard</th><th>Statut</th><th>Retard</th></tr>${attRows()}</table></div></div>`};
function attRows(){const d=cur.date;return sorted(S.students.filter(s=>s.cid===cur.cls)).map((s,i)=>{const r=AM.get(d+'_'+s.id)||{};const tg=k=>`<button class="tg ${r[k]?'ab':'pr'}" onclick="tog(${s.id},'${k}')">${r[k]?'Absent':'Présent'}</button>${r[k]?`<label class="j"><input type="checkbox" ${r[k+'j']?'checked':''} onchange="upd(${s.id},{${k}j:this.checked?1:0})"> justifiée</label>`:''}`;
return`<tr><td>${i+1}</td><td class="l">${esc(s.name)}</td><td>${tg('m')}</td><td><input type="number" min="0" class="n" placeholder="min" value="${r.ml||''}" onchange="upd(${s.id},{ml:Math.max(0,+this.value||0)})"></td><td>${tg('a')}</td><td><input type="number" min="0" class="n" placeholder="min" value="${r.al||''}" onchange="upd(${s.id},{al:Math.max(0,+this.value||0)})"></td><td><input value="${esc(r.r||'')}" placeholder="Optionnel" onchange="upd(${s.id},{r:this.value})"></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Ajoutez d’abord une classe et des élèves.</td></tr>'}
async function upd(sid,p){const k=cur.date+'_'+sid,r=Object.assign(AM.get(k)||{k,d:cur.date,sid,cid:cur.cls,m:0,a:0,mj:0,aj:0,r:'',ml:0,al:0},p);AM.set(k,r);await put('att',r);toast()}
async function tog(sid,k){const r=AM.get(cur.date+'_'+sid)||{};await upd(sid,{[k]:r[k]?0:1,[k+'j']:0});render()}
async function allPresent(){for(const s of S.students.filter(s=>s.cid===cur.cls)){const r=AM.get(cur.date+'_'+s.id);if(r&&(r.m||r.a))await upd(s.id,{m:0,a:0,mj:0,aj:0})}render()}
// ---------- rapports ----------
const hm=m=>Math.floor(m/60)+(LANG==='ar'?' س ':' h ')+String(m%60).padStart(2,'0')+(LANG==='ar'?' د':' min');
const MODES={all:'Tous les élèves',abs:'Absents seulement',late:'Retards seulement',both:'Absents et retards'};
const hSum=['Classe','Nom','Abs. matin','Abs. après-midi','Séances d’absence','Jours d’absence','Justifiées','Non justifiées','Retards (nb)','Retard total (h min)','Jours de retard (8 h = 1 j)','Total jours'];
function build(){const f=cur.from,t=cur.to,q=cur.rq.trim().toLowerCase(),md=cur.mode||'all';
const a=sorted(S.students.filter(s=>(!cur.rc||s.cid==cur.rc)&&s.name.toLowerCase().includes(q))).sort((x,y)=>cname(x.cid).localeCompare(cname(y.cid),'fr'));
const keep=(ab,la)=>md==='all'||(md==='abs'&&ab)||(md==='late'&&la)||(md==='both'&&(ab||la));
if(f===t){const rows=[];for(const s of a){const r=AM.get(f+'_'+s.id)||{};if(!keep(r.m||r.a,r.ml>0||r.al>0))continue;const z=k=>r[k]?(r[k+'j']?'Absent (justifié)':'Absent'):'Présent';rows.push([cname(s.cid),s.name,z('m'),z('a'),r.ml||0,r.al||0,r.r||''])}return{head:['Classe','Nom','Matin','Après-midi','Retard matin (min)','Retard après-midi (min)','Motif'],rows}}
const L=[];for(const s of a){const o=stats(s.id,f,t);if(keep(o.s>0,o.min>0))L.push(o&&[s,o])}
const rows=L.map(([s,o])=>{const dj=Math.floor(o.min/480);return[cname(s.cid),s.name,o.m,o.a,o.s,o.days,o.j,o.u,o.inc,hm(o.min),dj,o.days+dj]});
const c=i=>rows.reduce((x,r)=>x+r[i],0);
const tot=['Total','',c(2),c(3),c(4),c(5),c(6),c(7),c(8),hm(L.reduce((x,[,o])=>x+o.min,0)),c(10),c(11)];return{head:hSum,rows:rows.length?[...rows,tot]:[]}}
V.rep=()=>{const b=build();return`${head('rep')}<div class="card"><div class="row"><select onchange="cur.rc=this.value;render()">${opts(cur.rc,1)}</select><select onchange="cur.mode=this.value;render()">${Object.entries(MODES).map(([k,v])=>`<option value="${k}" ${(cur.mode||'all')===k?'selected':''}>${v}</option>`).join('')}</select><input placeholder="🔍 Élève" value="${esc(cur.rq)}" onchange="cur.rq=this.value;render()"></div><div class="row"><label>Du <input type="date" value="${cur.from}" onchange="cur.from=this.value;render()"></label><label>Au <input type="date" value="${cur.to}" onchange="cur.to=this.value;render()"></label><span class="chip"><button onclick="preset('d')">Jour</button><button onclick="preset('w')">Semaine</button><button onclick="preset('m')">Mois</button></span></div>
<div class="row"><button class="pri" onclick="expXlsx()">⬇ Excel</button><button class="pri" onclick="expPdf()">⬇ PDF</button><button onclick="expPrint()">🖨 Imprimer</button></div><div class="wrap"><table><tr>${b.head.map(h=>`<th>${h}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i==1?'l':''}">${esc(c)}</td>`).join('')}</tr>`).join('')||`<tr><td class="empty">Aucune donnée</td></tr>`}</table></div></div>`};
function preset(k){const d=cur.from;if(k==='d')cur.to=d;if(k==='w'){const w=(new Date(d+'T12:00:00').getDay()+6)%7;cur.from=addD(d,-w);cur.to=addD(cur.from,6)}if(k==='m'){const y=+d.slice(0,4),m=+d.slice(5,7);cur.from=d.slice(0,8)+'01';cur.to=fmt(new Date(y,m,0))}render()}
const title=()=>`${S.school||T('Établissement')} — ${cur.rc?cname(cur.rc):T('Toutes les classes')} — ${T(MODES[cur.mode||'all'])} — ${cur.from===cur.to?cur.from:cur.from+' → '+cur.to}`;
function expXlsx(){const b=build(),ws=XLSX.utils.aoa_to_sheet([[title()],['Généré le '+new Date().toLocaleString(LOC)],[],b.head.map(T),...b.rows.map(r=>r.map(c=>typeof c==='string'?T(c):c))]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Rapport');XLSX.writeFile(wb,`rapport_${cur.from}_${cur.to}.xlsx`)}
function expPrint(){const b=build();$('#print').innerHTML=`<h2 style="text-align:center">${esc(S.school||T('Établissement'))}</h2><p>Classe : ${esc(cur.rc?cname(cur.rc):T('Toutes les classes'))} | Contenu : ${T(MODES[cur.mode||'all'])} | Période : ${cur.from} → ${cur.to} | Généré le ${new Date().toLocaleDateString(LOC)}</p><table><tr>${b.head.map(h=>`<th>${h}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;window.print()}

V.data=()=>`${head('data')}
<div class="card"><h3>Nom de l’établissement</h3><div class="row"><input id="sn" value="${esc(S.school)}" placeholder="Apparaît sur les rapports"><button class="pri" onclick="saveSchool()">Enregistrer</button></div><div class="row"><button onclick="$('#lf').click()">🖼 Choisir le logo</button>${LOGO?`<img src="${LOGO}" style="height:40px;border-radius:6px"><button class="dg" onclick="LOGO='';put('meta',{k:'logo',v:''});render()">Retirer</button>`:''}</div></div>
${calCard()}<div class="card"><h3>Sauvegarde et restauration</h3><div class="row"><button class="pri" onclick="expJson()">⬇ Sauvegarde JSON</button><button onclick="$('#jf').click()">⬆ Restaurer un JSON</button><button onclick="expFull()">⬇ Export complet Excel</button><button onclick="restoreAuto()">Restaurer la sauvegarde automatique</button></div><p class="mu" style="margin:0">Une sauvegarde automatique est faite chaque jour dans le navigateur. Vous pouvez déposer le fichier JSON dans votre dépôt GitHub.</p></div>
<div class="card"><h3>Sauvegarde GitHub</h3><p class="mu" style="margin:0 0 12px">Chaque sauvegarde crée un nouveau fichier daté (sauvegarde-AAAA-MM-JJ_HH-MM.json) dans le dossier choisi ; à la restauration, vous choisissez la date. Le token est saisi ici, gardé uniquement dans ce navigateur et jamais écrit dans le code ni dans les sauvegardes.</p>
<div class="row"><input id="go" placeholder="Utilisateur GitHub" value="${esc(GH.owner)}"><input id="gr" placeholder="Dépôt (ex. sauvegardes-ecole)" value="${esc(GH.repo)}"><input id="gb" placeholder="Branche" style="width:110px" value="${esc(GH.branch)}"></div>
<div class="row"><input id="gp" placeholder="Dossier des sauvegardes (ex. backups)" style="min-width:250px" value="${esc(GH.path)}"><input id="gt" type="password" autocomplete="off" style="min-width:250px" placeholder="${GH.token?'Token enregistré (vide = le garder)':'Token d’accès personnel'}"></div>
<label class="row"><input type="checkbox" id="ga" style="width:auto" ${GH.auto?'checked':''}> Sauvegarde automatique une fois par jour à l’ouverture</label>
<div class="row"><button class="pri" onclick="ghSave()">Enregistrer les réglages</button><button class="pri" onclick="ghSync()">🔄 Synchroniser</button><button onclick="ghPush()">⬆ Sauvegarder maintenant</button><button onclick="ghPull()">⬇ Restaurer depuis GitHub</button><button class="dg" onclick="ghClear()">Effacer le token</button></div><p id="ghm" style="margin:0 0 8px;font-weight:500"></p>
<details><summary style="cursor:pointer;font-weight:600">Comment créer le token ?</summary><ol class="mu"><li>Créez un dépôt <b>privé</b> dédié aux sauvegardes (les noms d’élèves sont des données personnelles).</li><li>GitHub → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token.</li><li>Repository access : <b>Only select repositories</b>, choisissez ce dépôt uniquement.</li><li>Permissions → Repository permissions → <b>Contents : Read and write</b>. Choisissez une date d’expiration.</li><li>Copiez le token et collez-le ci-dessus. Chaque envoi crée une version dans l’historique Git.</li></ol></details></div>
<div class="card"><h3>Importer des élèves depuis Excel</h3><div class="row"><button class="pri" onclick="$('#xf').click()">⬆ Choisir un fichier .xlsx / .xls</button><button onclick="tpl()">⬇ Modèle d’import</button></div><div id="imp">${IM?impHtml():''}</div></div>`;
async function saveSchool(){S.school=$('#sn').value.trim();await put('meta',{k:'school',v:S.school});toast()}
const dl=(name,blob)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()};
const expJson=()=>dl(`sauvegarde_${td()}.json`,new Blob([JSON.stringify(dump())],{type:'application/json'}));
$('#jf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const o=JSON.parse(await f.text());if(!o.students)throw 0;if(await dlg('Les données actuelles seront remplacées. Continuer ?',[],'Restaurer'))await restore(o)}catch{alert('Fichier invalide')}};
async function restoreAuto(){const m=await P(st('meta').get('auto'));if(!m)return alert('Aucune sauvegarde automatique');if(await dlg('Restaurer la sauvegarde du '+m.d+' ?',[],'Restaurer'))await restore(m.data)}
function expFull(){const wb=XLSX.utils.book_new(),add=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(a),n);add('Classes',S.classes);add('Students',S.students);add('Attendance',[...AM.values()]);XLSX.writeFile(wb,`export_complet_${td()}.xlsx`)}
function tpl(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Nom','Classe'],['','']]),'Modèle');XLSX.writeFile(wb,'modele_import_eleves.xlsx')}
$('#xf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const wb=XLSX.read(await f.arrayBuffer());IM={sheets:wb.SheetNames.map(n=>({n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}).filter(r=>r.some(c=>String(c).trim()))})).filter(s=>s.rows.length>1)};const h=IM.sheets[0]?IM.sheets[0].rows[0].map(String):[];IM.nc=Math.max(0,h.findIndex(x=>/nom|name|élève|eleve|اسم/i.test(x)));IM.cc=h.findIndex(x=>/classe|class|niveau|قسم|فصل/i.test(x));render()};
function impRows(){const nrm=s=>String(s).trim().replace(/\s+/g,' ');const out=[];for(const s of IM.sheets)for(const r of s.rows.slice(1)){const name=nrm(r[IM.nc]||''),cn=nrm(IM.cc>=0?r[IM.cc]:s.n);if(!name||!cn)continue;const c=S.classes.find(c=>c.name===cn);out.push({name,cn,dup:!!c&&S.students.some(x=>x.cid===c.id&&x.name===name)||out.some(o=>o.cn===cn&&o.name===name)})}return out}
function impHtml(){if(!IM.sheets.length)return'<p>Fichier vide.</p>';const h=IM.sheets[0].rows[0],o=h.map((x,i)=>`<option value="${i}">${esc(x||'Colonne '+(i+1))}</option>`).join(''),rows=impRows();
return`<div class="row"><label>Colonne du nom <select onchange="IM.nc=+this.value;render()">${o.replace(`value="${IM.nc}"`,`value="${IM.nc}" selected`)}</select></label><label>Colonne de la classe <select onchange="IM.cc=+this.value;render()"><option value="-1" ${IM.cc<0?'selected':''}>Nom de la feuille</option>${o.replace(`value="${IM.cc}"`,`value="${IM.cc}" selected`)}</select></label></div>
<p>Nouveaux : <b>${rows.filter(r=>!r.dup).length}</b> · Doublons (ignorés, historique conservé) : <b>${rows.filter(r=>r.dup).length}</b></p><div class="wrap" style="max-height:260px;overflow:auto"><table><tr><th>Classe</th><th>Nom</th><th>Statut</th></tr>${rows.slice(0,100).map(r=>`<tr><td>${esc(r.cn)}</td><td class="l">${esc(r.name)}</td><td>${r.dup?'Doublon':'Nouveau'}</td></tr>`).join('')}</table></div><div class="row" style="margin-top:12px"><button class="pri" onclick="confirmImport()">Confirmer l’import</button><button onclick="IM=null;render()">Annuler</button></div>`}
async function confirmImport(){let n=0;for(const r of impRows().filter(r=>!r.dup)){let c=S.classes.find(c=>c.name===r.cn);if(!c){const id=await put('classes',{id:nid(),name:r.cn});c={id,name:r.cn};S.classes.push(c)}const s={id:nid(),sid:nextSid(),name:r.name,cid:c.id},id=await put('students',s);S.students.push({...s,id});n++}IM=null;await load();alert(n+' élève(s) importé(s)');render()}

const ghNow=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return td()+'_'+p(d.getHours())+'-'+p(d.getMinutes())};
const pick=(title,items)=>new Promise(res=>{const d=$('#dlg');d.innerHTML=`<form method="dialog"><h3>${title}</h3><div style="display:grid;gap:6px;max-height:50vh;overflow:auto">${items.map(n=>`<button value="${esc(n)}">${esc(n)}</button>`).join('')}</div><div class="row" style="margin:14px 0 0;justify-content:flex-end"><button value="x">Annuler</button></div></form>`;d.returnValue='x';d.onclose=()=>res(d.returnValue==='x'?null:d.returnValue);d.showModal()});
const ghH=raw=>({Authorization:'Bearer '+GH.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
const ghErr=async r=>{try{return r.status+' – '+(await r.json()).message}catch{return String(r.status)}};
const ghFail=e=>e instanceof TypeError?'Réseau indisponible, ou fonction bloquée dans cet aperçu : utilisez votre site GitHub Pages.':e.message;
const ghOk=()=>GH.token&&GH.owner&&GH.repo;
async function ghPush(){await ghRead();if(!ghOk())return ghMsg('Renseignez utilisateur, dépôt et token.',1);ghMsg('Envoi en cours…');
try{const content=btoa(unescape(encodeURIComponent(JSON.stringify(dump())))),path=GH.path+'/sauvegarde-'+ghNow()+'.json';let r;
for(let i=0;i<2;i++){let sha;if(i){const g=await fetch(ghU(path)+ghQ(),{headers:ghH(),cache:'no-store'});if(g.ok)sha=(await g.json()).sha}
const body={message:'Sauvegarde '+ghNow(),content,branch:GH.branch};if(sha)body.sha=sha;
r=await fetch(ghU(path),{method:'PUT',headers:{...ghH(),'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.status!==409&&r.status!==422)break}
if(!r.ok)throw new Error(await ghErr(r));await put('meta',{k:'ghlast',d:td()});ghMsg('Sauvegarde envoyée ✓ '+path);return true}catch(e){ghMsg('Échec : '+ghFail(e),1);return false}}
async function ghPull(){await ghRead();if(!ghOk())return ghMsg('Renseignez utilisateur, dépôt et token.',1);ghMsg('Recherche des sauvegardes…');
try{const r=await fetch(ghU(GH.path)+ghQ(),{headers:ghH(),cache:'no-store'});if(!r.ok)throw new Error(await ghErr(r));
const names=(await r.json()).filter(f=>/^sauvegarde.*\.json$/.test(f.name)).map(f=>f.name).sort().reverse();if(!names.length)throw new Error('Aucune sauvegarde trouvée dans ce dossier');ghMsg('');
const n=await pick('Choisir la sauvegarde (la plus récente en haut)',names);if(!n)return;
const f=await fetch(ghU(GH.path+'/'+n)+ghQ(),{headers:ghH(1),cache:'no-store'});if(!f.ok)throw new Error(await ghErr(f));const o=JSON.parse(await f.text());if(!o.students)throw new Error('Fichier de sauvegarde invalide');
if(await dlg('Remplacer les données actuelles par « '+n+' » ?',[],'Restaurer')){await restore(o);ghMsg('Données restaurées ✓')}}catch(e){ghMsg('Échec : '+ghFail(e),1)}}
async function ghAuto(){const l=await P(st('meta').get('ghlast'));if(GH.auto&&ghOk()&&navigator.onLine&&S.students.length&&(!l||l.d!==td()))ghSync()}
// ---------- calendrier scolaire ----------
const WD=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'],calSave=()=>put('meta',{k:'cal',v:CAL});
function calCard(){const rows=CAL.list.map((h,i)=>[h,i]).sort((x,y)=>x[0].a.localeCompare(y[0].a)).map(([h,i])=>`<tr><td>${h.a}</td><td>${h.b}</td><td class="l">${esc(h.n)}</td><td><button class="dg" onclick="calDel(${i})">🗑</button></td></tr>`).join('');
return`<div class="card"><h3>Calendrier scolaire (jours fériés et vacances)</h3><div class="row"><span class="mu">Jours de repos hebdomadaires :</span>${WD.map((n,i)=>`<label style="display:flex;gap:4px;align-items:center"><input type="checkbox" style="width:auto" ${CAL.we.includes(i)?'checked':''} onchange="calWe(${i},this.checked)">${n}</label>`).join('')}</div>
<div class="row"><label>Du <input type="date" id="ha"></label><label>Au <input type="date" id="hb"></label><input id="hn" placeholder="Libellé"><button class="pri" onclick="calAdd()">Ajouter</button></div>
<div class="row"><button onclick="$('#hf').click()">⬆ Importer les jours fériés (Excel)</button><button onclick="calTpl()">⬇ Modèle Excel</button></div>
<div class="wrap" style="max-height:230px;overflow:auto"><table><tr><th>Début</th><th>Fin</th><th>Libellé</th><th></th></tr>${rows||'<tr><td colspan="4" class="empty">Aucun jour férié enregistré</td></tr>'}</table></div></div>`}
async function calWe(i,on){CAL.we=on?[...new Set([...CAL.we,i])]:CAL.we.filter(x=>x!==i);await calSave();toast()}
async function calAdd(){const a=$('#ha').value,b=$('#hb').value||a;if(!a)return;CAL.list.push({a,b:b<a?a:b,n:$('#hn').value.trim()||'Jour férié'});await calSave();render()}
async function calDel(i){CAL.list.splice(i,1);await calSave();render()}
function calTpl(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Début','Fin','Libellé'],['','','']]),'Jours fériés');XLSX.writeFile(wb,'modele_jours_feries.xlsx')}
const parseD=v=>{if(v instanceof Date)return fmt(new Date(v.getTime()+432e5));v=String(v).trim();let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:''};
$('#hf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).filter(r=>r.some(c=>String(c).trim()));if(rows.length<2)return alert('Fichier vide');
const h=rows[0].map(x=>String(x).toLowerCase()),ix=(re,d)=>{const i=h.findIndex(x=>re.test(x));return i<0?d:i},ia=ix(/d[ée]but|start|du\b|date|بداية/,0),ib=ix(/fin|end|\bau\b|نهاية/,-1),inn=ix(/libell|nom|motif|name|label|عطلة|اسم/,2);let n=0;
for(const r of rows.slice(1)){const a=parseD(r[ia]),b=ib>=0?parseD(r[ib])||a:a;if(!a)continue;const o={a,b:b<a?a:b,n:String(r[inn]??'').trim()||'Jour férié'};if(!CAL.list.some(x=>x.a===o.a&&x.b===o.b&&x.n===o.n)){CAL.list.push(o);n++}}
await calSave();alert(n+(LANG==='ar'?' عطلة مستوردة':' jour(s) férié(s) importé(s)'));render()};
$('#lf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const im=new Image();im.onload=async()=>{const k=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);LOGO=c.toDataURL('image/png');await put('meta',{k:'logo',v:LOGO});render()};im.src=URL.createObjectURL(f)};
// ---------- synchronisation (fusion des sauvegardes GitHub) ----------
function mergeAll(os){const L=dump(),M={classes:new Map(),students:new Map(),att:new Map()},tomb=new Map(),all=[L,...os];
for(const o of all){for(const t of o.tomb||[]){const k=t.s+t.k,e=tomb.get(k);if(!e||t.u>e.u)tomb.set(k,t)}
for(const[n,key]of[['classes','id'],['students','id'],['att','k']])for(const r of o[n]||[]){const m=M[n],e=m.get(r[key]);if(!e||(r.u||0)>(e.u||0))m.set(r[key],r)}}
const alive=(s,r)=>{const t=tomb.get(s+r.id);return!t||(r.u||0)>t.u},classes=[...M.classes.values()].filter(r=>alive('classes',r)),students=[...M.students.values()].filter(r=>alive('students',r)),ids=new Set(students.map(s=>s.id)),cal={we:(L.cal||CAL).we,list:[]},seen=new Set();
for(const o of all)for(const h of(o.cal||{}).list||[]){const k=h.a+h.b+h.n;if(!seen.has(k)){seen.add(k);cal.list.push(h)}}
return{school:L.school||os.map(o=>o.school).find(Boolean)||'',classes,students,att:[...M.att.values()].filter(r=>ids.has(r.sid)),tomb:[...tomb.values()],cal}}
async function ghSync(){await ghRead();if(!ghOk())return ghMsg('Renseignez utilisateur, dépôt et token.',1);ghMsg('Synchronisation…');
try{const r=await fetch(ghU(GH.path)+ghQ(),{headers:ghH(),cache:'no-store'});let names=[];if(r.ok)names=(await r.json()).filter(f=>/^sauvegarde.*\.json$/.test(f.name)).map(f=>f.name).sort().reverse().slice(0,5);else if(r.status!==404)throw new Error(await ghErr(r));
const os=[];for(const n of names){const f=await fetch(ghU(GH.path+'/'+n)+ghQ(),{headers:ghH(1),cache:'no-store'});if(f.ok){try{const o=JSON.parse(await f.text());if(o.students)os.push(o)}catch{}}}
if(os.length)await restore(mergeAll(os));if(await ghPush())ghMsg('Synchronisation terminée ✓ ('+os.length+' fichier(s) fusionné(s))')}catch(e){ghMsg('Échec : '+ghFail(e),1)}}
// ---------- PDF direct (logo, tableau soigné, pages numérotées) ----------
async function expPdf(){try{const b=build(),rtl=LANG==='ar'?'rtl':'ltr',tc=c=>typeof c==='string'?T(c):c,per=14,pages=[];for(let i=0;i<Math.max(b.rows.length,1);i+=per)pages.push(b.rows.slice(i,i+per));
const{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),host=document.createElement('div');host.style.cssText='position:fixed;left:0;top:0;z-index:-1';document.body.appendChild(host);
for(let i=0;i<pages.length;i++){const d=document.createElement('div');d.style.cssText=`width:1123px;height:794px;background:#fff;color:#111;padding:34px 40px;box-sizing:border-box;font-family:Inter,Cairo,Arial,sans-serif;direction:${rtl};position:relative`;
d.innerHTML=`<div style="display:flex;align-items:center;gap:18px;border-bottom:3px solid #4f46e5;padding-bottom:12px;margin-bottom:14px">${LOGO?`<img src="${LOGO}" style="height:64px;max-width:120px;object-fit:contain">`:''}<div style="flex:1"><div style="font-size:24px;font-weight:700">${esc(S.school||T('Établissement'))}</div><div style="color:#555;font-size:13px;margin-top:4px">${esc(T(MODES[cur.mode||'all']))} · ${esc(cur.rc?cname(cur.rc):T('Toutes les classes'))}</div></div><div style="text-align:end;font-size:13px;color:#555">${cur.from===cur.to?cur.from:cur.from+' → '+cur.to}<br>${new Date().toLocaleDateString(LOC)}</div></div>
<table style="width:100%;border-collapse:collapse;font-size:13px"><tr>${b.head.map(h=>`<th style="background:#4f46e5;color:#fff;padding:8px 6px;border:1px solid #3b35b8">${esc(T(h))}</th>`).join('')}</tr>${pages[i].map((r,k)=>`<tr style="background:${r[0]==='Total'?'#e6e8fb;font-weight:700':k%2?'#f3f4fb':'#fff'}">${r.map(c=>`<td style="padding:7px 6px;border:1px solid #d9dcea;text-align:center">${esc(tc(c))}</td>`).join('')}</tr>`).join('')}</table>
<div style="position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;color:#777">${LANG==='ar'?'صفحة':'Page'} ${i+1} / ${pages.length}</div>`;
host.appendChild(d);const cv=await html2canvas(d,{scale:2,backgroundColor:'#fff',x:0,y:0,scrollX:0,scrollY:0});if(i)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,297,210);host.removeChild(d)}
document.body.removeChild(host);pdf.save(`rapport_${cur.from}_${cur.to}.pdf`)}catch(e){alert('PDF : '+e.message+' (connexion requise la première fois)')}}
